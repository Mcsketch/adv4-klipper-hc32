# AD4 SoC network. Caleb's unit (NA / N32, 2026-10-27): the printer sits on the
# home LAN over WiFi (wlan0, DHCP from the router) and eth0 also asks for a DHCP
# lease; the Klipper host is prodesk/veldin. ETH_MODE=static restores the old
# point-to-point cable layout (SOC_IP on eth0, host 192.168.10.1).
ETH_MODE=dhcp
SOC_IP=192.168.10.10
SOC_NET=24
BRIDGE_PORT=5000
NET_FALLBACK_SECS=360

# Where klipper/moonraker live.
KLIPPER_HOST=192.168.1.10
MOONRAKER_PORT=7125
