# =============================================================
# Flashforge Adventurer 4 — HC32F460 (HD rev) Klipper config
# Heater/sensor map SETTLED 2026-10-22 by disassembling the
# factory HD firmware (control-2.3.0). Evidence in
# adv4-exploration.md; earlier guesses corrected there.
#
# PROVEN by firmware RE (PORT_SetFunc AF4 + ADC channel mask):
#   hotend heater  PA1  (TMRA2 Ch2; fw clamps 250/300C)
#   bed heater     PA7  (TMRA1 Ch5; fw clamps 200/130C)
#   hotend NTC     PA0  (ADC1 CH0; fw: R = 4700*adc/(4095-adc))
#   bed NTC        PA5  (ADC1 CH5)
#   chamber fan    PB9  (TMRA4)
#   PC10 = USART1_TX @9600 — NOT a TMC UART (tmc2209 disabled)
#   PC0 is NOT an ADC input in the factory design.
#   The 23->67C "bed heater" test on 2026-10-21 actually heated
#   the HOTEND (PA1) — user felt the nozzle warm. Consistent.
# Stepper + endstop pins PROVEN 2026-10-22: all three axes home to their
# switch, and each switch was actuated by hand under ad4-watch.py.
# =============================================================

[include adv3-macros.cfg]
[include fluidd.cfg]
[include KAMP_Settings.cfg]
[exclude_object]

# Fluidd/moonraker list and start files from this directory; moonraker requires
# it to match its own gcodes folder (~/printer_data/gcodes -> here).
[virtual_sdcard]
path: /Users/admin/adv4/gcodes
on_error_gcode: CANCEL_PRINT

[mcu]
# Serial chain (proven 2026-10-22): MCU USART2 PA9/PA10 @115200 ->
# SoC /dev/ttyS1 -> ad4-bridge :5000 -> direct TCP. No socat PTY
# (it raced on reconnect). See adv4-soc-hack.md.
serial: socket://192.168.10.10:5000
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
# Starting values from the ADV3-derived stock config. Re-validate with
# ACCELERATION_TEST / SQUARE_CORNER_TEST before printing fast.
max_velocity: 800
square_corner_velocity: 6
max_accel: 6500
max_z_velocity: 30
max_z_accel: 400

[stepper_x]
step_pin: PA8
# dir inverted 2026-10-22: +X was driving LEFT, but the X endstop is on the
# RIGHT (verified by hand with ad4-watch.py; G28 X then ran the full 220 mm
# into the left belt stop -> "No trigger on stepper_x after full movement").
dir_pin: PC9
enable_pin: !PA11
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC3
position_endstop: 220
position_max: 220
position_min: 0
homing_speed: 75

[stepper_y]
step_pin: PB14
dir_pin: !PB13
enable_pin: !PB15
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC1
position_endstop: 4
position_max: 200
position_min: 0
homing_speed: 75

[stepper_z]
step_pin: PA15
dir_pin: !PA12
enable_pin: !PC11
microsteps: 16
rotation_distance: 6.25
endstop_pin: ^PB5   # was !PB5: read TRIGGERED at rest (M119) -> inverted
position_min: -2
position_max: 250
homing_positive_dir: false   # Z homes down toward the bed (dual-Z bed)
homing_speed: 25
second_homing_speed: 15

# ----------------------------------------------------------------
# Thermistors — curves extracted from the factory HD firmware.
# Both sensors are 100k NTC (beta ~4000) on a 4.7k pull-up; the
# firmware converts ADC->ohms with exactly Klipper's formula
# (r = pullup*adc/(4095-adc)), so pullup_resistor: 4700 is right.
# One hotend curve covers BOTH hotend models (240C std / 265C
# high-temp): the firmware's second hotend table is vestigial
# (its globals are initialized but never fed by the ADC).
#   ad4_hotend: fw LUT sensor_id 0 (PA0), fit 20-300C, max err 0.7C
#   ad4_bed:    fw LUT sensor_id 3 (PA5), fit 20-130C, max err 0.5C
#   ad4_rawadc: diagnostic — reports the RAW 12-bit ADC value as
#               "temperature" (sanity-checks the ADC scale live).
# ----------------------------------------------------------------
[thermistor ad4_hotend]
temperature1: 55.0
resistance1: 29559.0
temperature2: 70.0
resistance2: 17285.0
temperature3: 260.0
resistance3: 189.0

[thermistor ad4_bed]
temperature1: 29.0
resistance1: 81221.9
temperature2: 110.0
resistance2: 5200.5
temperature3: 118.0
resistance3: 4214.5

[adc_temperature ad4_rawadc]
temperature1: 0
voltage1: 0.000001
temperature2: 4095
voltage2: 1.0

# (raw probes on PA0/PA5 would clash with the heater sensors — klipper
# allows each ADC pin only once. The heater temps validate the scale.)
# raw_PC0 probe REMOVED 2026-10-22: PC0 is NOT an ADC input in the factory
# design — it floats and reads 4095, which the ad4_rawadc type displayed as
# "4095 C" in Fluidd. The ad4_rawadc type is kept only for bench probing.

[extruder]
step_pin: PC7
# dir inverted 2026-10-23: E+ was pulling filament OUT of the hotend (retract
# extruded and vice versa), so PC6 drives the opposite sense to X/Y/Z.
dir_pin: !PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.3
filament_diameter: 1.750
heater_pin: PA1   # fw RE: TMRA2 Ch2, clamps 250/300C
sensor_type: ad4_hotend
sensor_pin: PA0   # fw RE: ADC1 CH0
pullup_resistor: 4700
min_temp: 0
# Nozzle rating, not the curve limit. 265 = factory UI ceiling
# for the high-temp nozzle; never exceed the fitted nozzle's rating.
max_temp: 265
# Default, written out because it is what greys out Fluidd's Extrude/Retract
# buttons: klipper sets extruder.can_extrude false below this nozzle temp.
min_extrude_temp: 170
max_extrude_only_distance: 550
max_extrude_only_velocity: 2000
max_extrude_cross_section: 5
pressure_advance: 2.1
pressure_advance_smooth_time: 0.1

[heater_bed]
heater_pin: PA7   # fw RE: TMRA1 Ch5, clamps 200/130C
sensor_type: ad4_bed
sensor_pin: PA5   # fw RE: ADC1 CH5
pullup_resistor: 4700
min_temp: 0
# Bed rated 120-130C (user, 2026-10-22); factory LUT covers to 205C.
max_temp: 120

# NOTE: PA8/PC9/PA11=X, PB14/PB13/PB15=Y, PA15/PA12/PC11=Z and
# PC3/PC1/PB5=endstops are PROVEN (all axes home). PC7/PC6/PC8=E are still
# unexercised — the first hot extrusion is what proves them.
# PA13/PA14 are SWDIO/SWCLK: keep FREE for the ST-Link dump work.

[heater_fan hotend_fan]
pin: PC2          # confirmed: spins up when the hotend gets hot
heater: extruder
heater_temp: 50.0

# [fan] part-cooling fan: pin NOT identified. PA5 (old guess) is the
# bed thermistor. PB9 (below) is the chamber fan, not the part fan
# (M106 on PB9 spun the chamber fan on the NA unit, 2026-10-28).
# M106/M107 will error until a fan pin is confirmed.

[controller_fan mainboard]
pin: PC5
heater: extruder, heater_bed

[fan_generic chamber_fan]
pin: PB9          # fw RE: TMRA4
# 0.1 s = 10 Hz soft PWM: the fan's own driver audibly ticks once per cycle.
# 200 Hz is out of the tick range. (Hardware PWM `~PB9` is available — PB9 is
# TMRA4 Ch4 in hard_pwm.c — but this port's TimerA divider caps it near 4 kHz,
# which just moves the noise to a whistle, so soft PWM at 200 Hz is the fix.)
cycle_time: 0.005

# ----------------------------------------------------------------
# Nozzle temperature calibration (replaces the factory SoC behavior).
# The stock firmware stores a 2-digit per-nozzle target-temp offset
# on the SoC and shifts the setpoint before sending it to the MCU
# (Config::getExtruder*TempOffset / SerialObject::getAutoOffsetValue).
# Replicate that here as a macro. Values are YOUR measured ones:
#   nozzle A (e.g. 0.4mm, 235C): offset 12
#   nozzle B (e.g. 0.3mm, 265C): offset 14   <-- adjust to your real values
# Usage: M104 S210 then NOZZLE_OFFSET N=12, or fold into START.
# ----------------------------------------------------------------
[gcode_macro NOZZLE_OFFSET]
description: shift the current extruder target by the nozzle cal offset
gcode:
    {% set n = params.N|default(0)|int %}
    {% set cur = printer.extruder.target %}
    {% if cur > 0 %}
    M104 S{(cur + n)|int}
    {% endif %}

# Lets you move axes before homing (SET_KINEMATIC_POSITION) — required for
# the bench tests that prove the stepper/endstop pins. Turn it off once the
# pin map is verified.
[force_move]
enable_force_move: True

[homing_override]
axes: zxy
gcode:
 g28 z
 g28 x
 g28 y

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 200, 160
probe_count: 3, 3
fade_start: 1
fade_end: 10
fade_target: 0

[input_shaper]
# ADV3-derived starting values — re-run SHAPER_CALIBRATE per axis.
shaper_freq_x: 205
shaper_type: mzv
shaper_freq_y: 197.126
shaper_type: ei

[firmware_retraction]
retract_length: 3.8
retract_speed: 25
unretract_extra_length: 0
unretract_speed: 25

