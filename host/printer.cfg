# =============================================================
# Flashforge Adventurer 4, NA mainboard (Nation N32G455 MCU), Klipper.
# Board FFP0187_Main_Board_V1.0.3. Pins from the stock firmware (RE) and
# verified on a running unit; see docs/HARDWARE.md.
#
# MCU link: MCU USART1 @115200 -> printer SoC /dev/ttyS1 -> ad4-bridge on
# TCP :5000 (started by /opt/ad4-klipper/klipper-boot.sh) -> this host.
# Needs Klipper with host/klipper-socket-serial.patch (socket:// support);
# host/install-host.sh applies it. Use a wired link: over WiFi Klipper stops
# with "Timer too close".
#
# Values marked "measured" come from one unit. Before the first print, with
# someone at the printer:
#   1. G28 X / G28 Y / G28 Z one at a time, hand on the power switch.
#   2. Paper test for Z (position_endstop below), PID_CALIBRATE for both heaters.
# =============================================================

[include mainsail.cfg]
# moonraker-timelapse's macros (TIMELAPSE_TAKE_FRAME); install-host.sh links it
[include timelapse.cfg]

[mcu]
serial: socket://PRINTER_IP:5000
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
# Conservative start values (the reference unit runs 800/6500). Raise after
# the first prints look right.
# XY limit for TEST_SPEED and BRACE; jobs run at the speed mode's cap.
max_velocity: 300
max_accel: 2000
square_corner_velocity: 5
max_z_velocity: 5  # 10 mm/s stalls going up (2026-11-02)
max_z_accel: 100

[stepper_x]
step_pin: PA8
dir_pin: PC9
enable_pin: !PA11
# Measured 2026-11-02 at the driver default 1/8 step; drivers now set to 1/16 over UART.
microsteps: 16
rotation_distance: 33.9
endstop_pin: ^PC3
position_endstop: 220
position_max: 220
position_min: 0
homing_speed: 50

[stepper_y]
step_pin: PB14
dir_pin: !PB13
enable_pin: !PB15
# Measured 2026-11-02: equals rd 60 at 1/8 (driver default); drivers now 1/16 over UART.
microsteps: 16
rotation_distance: 60
endstop_pin: ^PC1
position_endstop: 4
position_max: 200
position_min: 0
homing_speed: 50

[stepper_z]
step_pin: PA15
dir_pin: PA12
enable_pin: !PC11
# Measured 2026-11-02: 1/8 step (driver not on the TMC UART bus); dir flipped (+ was down).
microsteps: 8
rotation_distance: 6.25
endstop_pin: ^PB5
# Z endstop is at the TOP. Measured (paper test at X110 Y100): Z0 = 254.7 below the switch.
position_endstop: 254.7
position_min: -2
position_max: 254.7
homing_positive_dir: true
homing_speed: 5
second_homing_speed: 2

# TMC2209s on one UART (PC10) through a mux: PB1/PB10 select, PB0/PB11 held low.
# Settings from the stock NA firmware boot config (RE 2026-11-02). Channel -> motor
# found 2026-11-02; a scan of all 16 mux states x 4 addresses (2026-11-03) finds
# only X, Y, E and a 4th chip on PB10 alone that gets no X/Y/Z steps (unused).
# Z's driver is standalone, off this bus. IOIN.enn reads 1 on every chip.
[tmc2209 stepper_x]
uart_pin: PC10
select_pins: !PB0, PB1, PB10, !PB11
run_current: 0.55
hold_current: 0.22

[tmc2209 stepper_y]
uart_pin: PC10
select_pins: !PB0, !PB1, !PB10, !PB11
run_current: 0.66
hold_current: 0.22

[tmc2209 extruder]
uart_pin: PC10
select_pins: !PB0, PB1, !PB10, !PB11
run_current: 1.38
hold_current: 0.72

# Thermistors: curves from the factory firmware LUTs (100k NTC, 4.7k pull-up).
[thermistor ad4_hotend]
temperature1: 55.0
resistance1: 29559.0
temperature2: 70.0
resistance2: 17285.0
temperature3: 260.0
resistance3: 189.0

[thermistor ad4_bed]
temperature1: 29.0
resistance1: 81221.9
temperature2: 110.0
resistance2: 5200.5
temperature3: 118.0
resistance3: 4214.5

[extruder]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PC8
microsteps: 16
# 2026-11-02: 100 mm @2 mm/s fed 80/90/80 at rd 33.5/26.8/24.1 -> slipping, not scaling.
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: ad4_hotend
sensor_pin: PA0
pullup_resistor: 4700
min_temp: 0
max_temp: 265
min_extrude_temp: 170
max_extrude_only_distance: 550
max_extrude_cross_section: 5
# PA tower 2026-11-04 (40 mm/s walls, accel 500) showed no clear best height;
# 0.04 is a typical direct-drive value.
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
# Measured (PID_CALIBRATE TARGET=210); re-run on your unit.
control: pid
pid_kp: 16.720
pid_ki: 6.192
pid_kd: 11.286

[heater_bed]
heater_pin: PA7
sensor_type: ad4_bed
sensor_pin: PA5
pullup_resistor: 4700
min_temp: 0
max_temp: 120
# Measured (PID_CALIBRATE TARGET=60); re-run on your unit.
control: pid
pid_kp: 68.060
pid_ki: 7.960
pid_kd: 145.478

[heater_fan hotend_fan]
pin: PC2
heater: extruder
heater_temp: 50.0

[controller_fan mainboard]
pin: PC5
heater: extruder, heater_bed

# Part-cooling fan = PA6 (stock NA fw RE 2026-11-03: its M106 handler stores S,
# clamped to 255, and the 1 ms tick software-PWMs PA6 from it; M107 zeroes it).
[fan]
pin: PA6

# PB9 = chamber fan (M106 S255 spun the chamber fan on this unit, 2026-10-28).
# Drive with SET_FAN_SPEED FAN=chamber_fan SPEED=1.
[fan_generic chamber_fan]
pin: PB9
cycle_time: 0.005

# PA4 = chamber light (the stock firmware software-PWMs it 0-100 % for M144-M146;
# lit and dimmed on this unit 2026-11-03). SET_PIN PIN=light VALUE=0..1.
# PRINT_START turns it on, PRINT_END off.
[output_pin light]
pin: PA4
pwm: True
cycle_time: 0.001
value: 0
shutdown_value: 0

[gcode_macro NOZZLE_OFFSET]
description: shift the current extruder target by the nozzle cal offset (stock-firmware behaviour)
gcode:
    {% set n = params.N|default(0)|int %}
    {% set cur = printer.extruder.target %}
    {% if cur > 0 %}
    M104 S{(cur + n)|int}
    {% endif %}

# Slicer start: PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer] MATERIAL=[filament_type[initial_extruder]]
# Purge is 10 mm of filament over 100 mm at 10 mm/s (~2.4 mm3/s): the hot end slips
# near 4.8 mm3/s (2026-11-02), keep slicer max volumetric speed <= 3.
[gcode_macro PRINT_START]
gcode:
  {% set r = printer["gcode_macro PLATE_REDO"] %}
  {% set here = printer.virtual_sdcard.file_position %}
  {% if r.armed and here == r.cur[0] and printer.toolhead.homed_axes == "xyz" and printer.extruder.can_extrude %}
  # PLATE_REDO of the first part: still hot and homed. RESUME left the
  # filament the slicer's retraction short of the tip, and the slicer's first
  # move retracts from the tip.
  SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=armed VALUE=0
  M83
  G1 E{printer["gcode_macro PAUSE"].swap_retract - 1} F1200
  G92 E0
  {% else %}
  SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=armed VALUE=0
  SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=between VALUE=0
  SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=cur VALUE="{[here, -1, -1, -1]}"
  SET_PIN PIN=light VALUE=1
  # Undo live tuning from the last job (panel TUNE, a calibration tower, a cancel).
  # Z offset is kept on purpose.
  {% set c = printer.configfile.settings %}
  M220 S100
  M221 S100
  _SET_VELOCITY_LIMIT_BASE VELOCITY={c.printer.max_velocity} ACCEL={c.printer.max_accel} SQUARE_CORNER_VELOCITY={c.printer.square_corner_velocity} MINIMUM_CRUISE_RATIO={c.printer.minimum_cruise_ratio}
  SET_PRESSURE_ADVANCE ADVANCE={c.extruder.pressure_advance}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=top VALUE=0
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=parked VALUE=0
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=swap VALUE=0
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=fed VALUE=0
  SET_GCODE_VARIABLE MACRO=PLATE_NEXT_OBJECT VARIABLE=n VALUE=1
  SET_GCODE_VARIABLE MACRO=SPEED_MODE VARIABLE=pending VALUE='""'
  SET_DISPLAY_TEXT
  {% set BED = params.BED|default(60)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(215)|float %}
  # Speed mode (SPEED_MODE): its nozzle temperature when hotter than the slicer's.
  {% set modes = printer["gcode_macro SPEED_MODE"].modes %}
  {% set mode = printer.save_variables.variables.speed_mode|default("CRUSH") %}
  {% set mode = mode if mode in modes else "CRUSH" %}
  SET_GCODE_VARIABLE MACRO=SPEED_MODE VARIABLE=job_temp VALUE={EXTRUDER}
  {% set EXTRUDER = [EXTRUDER, modes[mode][2]]|max %}
  # Chamber fan by material (roadmap Q7): full for PLA and anything unlisted
  # (heat creep in the closed case), half for PETG, off for the warping ones.
  {% set MATERIAL = params.MATERIAL|default("PLA")|upper %}
  {% set chamber = {"PETG": 0.5, "PET": 0.5, "ABS": 0, "ASA": 0, "PC": 0, "PA": 0, "PA-CF": 0, "HIPS": 0}.get(MATERIAL, 1) %}
  SET_FAN_SPEED FAN=chamber_fan SPEED={chamber}
  M140 S{BED}
  M104 S150
  G90
  G28
  M190 S{BED}
  G1 X20 Y10 F3000
  G1 Z5 F300
  M109 S{EXTRUDER}
  M83
  G1 Z0.3 F180
  G1 X120 E10 F600
  G1 Z2 F180
  G92 E0
  _SPEED_MODE_APPLY NAME={mode}
  {% endif %}

# Slicer end: PRINT_END. Lifts 10 mm, brings the bed forward (Y+ = bed forward).
[gcode_macro PRINT_END]
gcode:
  {% set z = [printer.toolhead.position.z + 10, 254]|min %}
  M400
  M220 S100
  M83
  G1 E-2 F1800
  G90
  G1 Z{z} F300
  G1 Y200 F3000
  TURN_OFF_HEATERS
  SET_FAN_SPEED FAN=chamber_fan SPEED=0
  M84
  SET_PIN PIN=light VALUE=0
  _PLATE_REDO_CLEAR
  _SPEED_MODE_RELOCK

# mainsail.cfg's CANCEL_PRINT (same section, later wins), plus the chamber fan off.
[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  M107
  SET_FAN_SPEED FAN=chamber_fan SPEED=0
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=swap VALUE=0
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=fed VALUE=0
  _PLATE_REDO_CLEAR
  _SPEED_MODE_RELOCK
  {% if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - 10) %}
    G91
    G1 Z5 F600
    G90
  {% endif %}
  CANCEL_PRINT_BASE

# Plate stops (roadmap B2). PAUSE lifts the nozzle 10 mm above the tallest
# part printed in this job, then brings the bed forward; RESUME goes back over
# the part at that height and only then down, so no move crosses a part low.
# These replace the PAUSE and RESUME in mainsail.cfg (same section, later wins).
# Orca, plate print sequence "by object": it prints the shortest first, travels
# above the last part to the next one and then runs Between objects G-code =
# PLATE_NEXT_OBJECT. Layer slider > Add pause runs Pause G-code = PLATE_PAUSE_LAYER.
[gcode_macro PAUSE]
description: Pause: lift clear of every printed part, bring the bed forward
rename_existing: PAUSE_BASE
variable_top: 0
variable_x: 0
variable_y: 0
variable_parked: 0
# filament pulled back while stopped: the slicer's retraction (5.5) + PAUSE's 1;
# LOAD_FILAMENT during a stop ends with it so RESUME + the slicer's unretract
# land at the tip, not 6.5 mm past it
variable_swap_retract: 6.5
# FILAMENT_SWAP: 1 change, 2 ran out, 0 none; fed = the new filament is loaded
variable_swap: 0
variable_fed: 0
gcode:
  {% if not printer.pause_resume.is_paused %}
    {% set p = printer.gcode_move.gcode_position %}
    {% set th = printer.toolhead %}
    {% set top = [top, p.z]|max %}
    PAUSE_BASE
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=top VALUE={top}
    {% if printer.extruder.can_extrude %}
      M83
      G1 E-1 F1500
    {% endif %}
    {% if th.homed_axes|length == 3 %}
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=x VALUE={p.x}
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=y VALUE={p.y}
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=parked VALUE=1
      G90
      G1 Z{[top + 10, th.axis_maximum.z - 2]|min} F300
      G1 Y{th.axis_maximum.y} F3000
    {% endif %}
    # the idle timeout (10 min) would turn the heaters and motors off mid-job
    SET_IDLE_TIMEOUT TIMEOUT=3600
  {% endif %}

[gcode_macro RESUME]
description: Resume: back over the part at the safe height, then down
rename_existing: RESUME_BASE
gcode:
  {% set v = printer["gcode_macro PAUSE"] %}
  {% if printer.pause_resume.is_paused %}
    {% if v.parked %}
      G90
      G1 X{v.x} Y{v.y} F3000
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=parked VALUE=0
    {% endif %}
    {% if printer.extruder.can_extrude %}
      M83
      G1 E1 F1500
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    SET_DISPLAY_TEXT
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=swap VALUE=0
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=fed VALUE=0
    SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=between VALUE=0
  {% endif %}
  RESUME_BASE {rawparams}
  {% set sm = printer["gcode_macro SPEED_MODE"] %}
  {% if sm.pending %}
    _SPEED_MODE_APPLY NAME={sm.pending}
    SET_GCODE_VARIABLE MACRO=SPEED_MODE VARIABLE=pending VALUE='""'
  {% endif %}

# Macro names: no digit after the leading letters. Klipper parses
# AD4_NEXT_OBJECT as the traditional command AD4 ("Unknown command").
[gcode_macro PLATE_NEXT_OBJECT]
description: Orca between-objects hook: stop until READY on the panel
variable_n: 1
gcode:
  {% set r = printer["gcode_macro PLATE_REDO"] %}
  {% set here = printer.virtual_sdcard.file_position %}
  {% if r.armed and here == r.cur[0] %}
    # PLATE_REDO: no stop. Up to the safe height, over to where the slicer had
    # the head for this part, down, and E 0 for the slicer's unretract.
    {% set v = printer["gcode_macro PAUSE"] %}
    SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=armed VALUE=0
    G90
    G1 Z{[v.top + 10, printer.toolhead.axis_maximum.z - 2]|min} F300
    G1 X{r.cur[1]} Y{r.cur[2]} F3000
    G1 Z{r.cur[3]} F300
    G92 E0
  {% else %}
    {% set p = printer.gcode_move.gcode_position %}
    {% set total = printer.exclude_object.objects|length %}
    SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=last VALUE="{r.cur}"
    SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=cur VALUE="{[here, p.x, p.y, p.z]}"
    SET_GCODE_VARIABLE MACRO=PLATE_NEXT_OBJECT VARIABLE=n VALUE={n + 1}
    SET_DISPLAY_TEXT MSG="Next: object {n + 1}{' of %d' % total if total else ''}"
    PAUSE
    SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=between VALUE=1
  {% endif %}

[gcode_macro PLATE_PAUSE_LAYER]
description: Orca layer pause; MSG= (from a custom G-code) is shown on the panel
gcode:
  SET_DISPLAY_TEXT MSG="{params.MSG|default('Layer pause')}"
  PAUSE

# Redo a failed part (roadmap B4). PRINT_START and PLATE_NEXT_OBJECT note
# where each part starts in the file (cur = [byte offset, x, y, z of the head
# there]; last = the part before). While stopped, PLATE_REDO purges 20 mm,
# rewinds the file to the start of the current part (at a between-objects
# stop: the part just finished) and arms the replay. On READY that start line
# runs again and, armed, skips the heating/homing or the stop and puts the head
# back where the slicer had it. Clear the failed part off first (on the first
# part also the skirt): the head goes back down where it was.
[gcode_macro PLATE_REDO]
description: While stopped: purge, then reprint the current part from its first layer
variable_cur: [-1, -1, -1, -1]
variable_last: [-1, -1, -1, -1]
variable_between: 0
variable_armed: 0
gcode:
  {% set n = printer["gcode_macro PLATE_NEXT_OBJECT"].n %}
  {% set t = last if between else cur %}
  {% if not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="PLATE_REDO: only while stopped"
  {% elif t[0] < 0 %}
    RESPOND TYPE=error MSG="PLATE_REDO: no part start noted in this job"
  {% else %}
    LOAD_FILAMENT LENGTH=20
    M26 S{t[0]}
    SET_GCODE_VARIABLE MACRO=PLATE_NEXT_OBJECT VARIABLE=n VALUE={n - between}
    SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=cur VALUE="{t}"
    SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=between VALUE=0
    SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=armed VALUE=1
    SET_DISPLAY_TEXT MSG="Redo object {n - between}: clear it off, then READY"
  {% endif %}

[gcode_macro _PLATE_REDO_CLEAR]
gcode:
  SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=cur VALUE="[-1, -1, -1, -1]"
  SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=last VALUE="[-1, -1, -1, -1]"
  SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=between VALUE=0
  SET_GCODE_VARIABLE MACRO=PLATE_REDO VARIABLE=armed VALUE=0

# Panel FILAMENT screen. TEMP defaults to the nozzle target if set, else 220.
# The Bowden tube is long: ~690 mm from the extruder gears to the nozzle
# (RUNBOOK section 4), so load and unload move the whole length. The tube part
# runs at 30 mm/s in 300 mm moves (max_extrude_only_distance is 550); through
# the hot end it is 1.5 mm/s (3.6 mm3/s, the hot end slips near 4.8 mm3/s).
# LOAD: LENGTH is the total, the last 120 mm slow (fast part ends ~90 mm
# short of the nozzle, the rest primes). LENGTH=20 (the panel's purge) is all slow.
# _FIL_STATE is for the panel's progress bar: dir 1 load, -1 unload, 0 none;
# e0 the extruder position the move counts from, len the net mm it moves.
[gcode_macro _FIL_STATE]
variable_dir: 0
variable_e0: 0
variable_len: 0
gcode:

[gcode_macro LOAD_FILAMENT]
description: Heat, then feed filament down the tube and through the hot end
gcode:
  {% set t = params.TEMP|default(printer.extruder.target if printer.extruder.target >= 170 else 220)|float %}
  {% set len = params.LENGTH|default(720)|float %}
  {% set fast = [len - 120, 0]|max %}
  SET_GCODE_VARIABLE MACRO=_FIL_STATE VARIABLE=e0 VALUE={printer.toolhead.position.e}
  SET_GCODE_VARIABLE MACRO=_FIL_STATE VARIABLE=len VALUE={len}
  SET_GCODE_VARIABLE MACRO=_FIL_STATE VARIABLE=dir VALUE=1
  M109 S{t}
  SAVE_GCODE_STATE NAME=filament
  M83
  {% for i in range((fast / 300)|round(0, 'ceil')|int) %}
    G1 E{[300, fast - i * 300]|min} F1800
  {% endfor %}
  G1 E{len - fast} F90
  {% set v = printer["gcode_macro PAUSE"] %}
  {% if printer.pause_resume.is_paused %}
    # after a swap the job stopped with the filament at the tip: only PAUSE's 1
    G1 E-{1 if v.swap else v.swap_retract} F1500
  {% endif %}
  RESTORE_GCODE_STATE NAME=filament
  # moves are only queued by now: the slow last stretch still has ~80 s to run
  M400
  SET_GCODE_VARIABLE MACRO=_FIL_STATE VARIABLE=dir VALUE=0
  {% if v.swap and len > 50 %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=fed VALUE=1
  {% endif %}

# Filament change (roadmap M1) and runout (Q6). FILAMENT_SWAP stops the job
# through PAUSE (lift clear, bed forward), moves the head to the empty corner so
# purges miss the part, and unloads. The panel's swap screen then offers Load,
# Purge and Resume; there is no wiper on this printer, so Resume only goes back
# over the part as after any stop. MSG= is shown there and on the phone.
# Orca's change_filament_gcode is M600. It sits after the layer change and
# before the travel's retract, so the filament is at the tip, as at a runout:
# LOAD_FILAMENT ends 1 mm back, not swap_retract.
[gcode_macro FILAMENT_SWAP]
description: During a job: stop, unload, wait for the panel. MSG= is shown there
gcode:
  {% if printer.print_stats.state != "printing" %}
    RESPOND TYPE=error MSG="FILAMENT_SWAP: only during a job"
  {% else %}
    {% set th = printer.toolhead %}
    SET_DISPLAY_TEXT MSG="{params.MSG|default('Change filament')}"
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=swap VALUE={params.KIND|default(1)|int}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=fed VALUE=0
    PAUSE
    G1 X{th.axis_maximum.x - 5} F3000
    UNLOAD_FILAMENT
  {% endif %}

[gcode_macro M600]
description: Filament change (slicer colour change)
gcode:
  FILAMENT_SWAP

# PB7: the stock firmware reads it as input with pull-down and flags runout
# after 5000 ticks low (5 s). NOT WORKING: tested 2026-11-06, it reads low under
# pull-up and pull-down with filament loaded, and stayed low with the filament
# pulled completely out. It never reports filament, so this cannot fire and
# nothing here detects a runout. Klipper fires this on any move, so a load or
# unload past the switch outside a job would do nothing here.
[filament_switch_sensor runout]
switch_pin: ^PB7
pause_on_runout: False
debounce_delay: 5
runout_gcode:
  {% if printer.print_stats.state == "printing" %}
    FILAMENT_SWAP MSG="Filament ran out" KIND=2
  {% endif %}

# UNLOAD: push 5 mm to soften the tip, ease 100 mm out of the hot end (the
# RUNBOOK's 10 at 10 mm/s + 90 at 5 mm/s), then the rest of LENGTH fast so
# the end clears the gears.
[gcode_macro UNLOAD_FILAMENT]
description: Heat, soften the tip, ease it out of the hot end, then pull it back up the tube
gcode:
  {% set t = params.TEMP|default(printer.extruder.target if printer.extruder.target >= 170 else 220)|float %}
  {% set len = params.LENGTH|default(720)|float %}
  {% set rest = [len - 100, 0]|max %}
  SET_GCODE_VARIABLE MACRO=_FIL_STATE VARIABLE=e0 VALUE={printer.toolhead.position.e + 5}
  SET_GCODE_VARIABLE MACRO=_FIL_STATE VARIABLE=len VALUE={len - 5}
  SET_GCODE_VARIABLE MACRO=_FIL_STATE VARIABLE=dir VALUE=-1
  M109 S{t}
  SAVE_GCODE_STATE NAME=filament
  M83
  G1 E5 F90
  G1 E-10 F600
  G1 E-{[len - 10, 90]|min} F300
  {% for i in range((rest / 300)|round(0, 'ceil')|int) %}
    G1 E-{[300, rest - i * 300]|min} F1800
  {% endfor %}
  RESTORE_GCODE_STATE NAME=filament
  # moves are only queued by now: the slow last stretch still has ~80 s to run
  M400
  SET_GCODE_VARIABLE MACRO=_FIL_STATE VARIABLE=dir VALUE=0

# Clog clearing, hands-free, PLA (roadmap Q8). Passes of: heat, soak, work the
# filament up and down, fill the melt zone, cool with the part fan, then pull
# the plug out cold. That is below min_extrude_temp, hence FORCE_MOVE. The last
# pass feeds back and purges. The panel shows it from step (1 heat, 2 work,
# 3 cool, 4 pull, 5 purge, 6 finished) and asks you to look at the nozzle:
# nothing here can sense flow. The plug stays on the filament's end, so what it
# picked up goes back in; only cutting the end off by hand gets rid of it.
[gcode_macro CLEAR_CLOG]
description: Hands-free clog clearing (PLA). PASSES= HOT= COLD=
variable_step: 0
variable_pass: 0
variable_passes: 0
gcode:
  {% if printer.print_stats.state in ("printing", "paused") %}
    RESPOND TYPE=error MSG="CLEAR_CLOG: not during a job"
  {% else %}
    {% set n = params.PASSES|default(3)|int %}
    SET_GCODE_VARIABLE MACRO=CLEAR_CLOG VARIABLE=passes VALUE={n}
    SET_GCODE_VARIABLE MACRO=CLEAR_CLOG VARIABLE=pass VALUE=1
    SET_GCODE_VARIABLE MACRO=CLEAR_CLOG VARIABLE=step VALUE=1
    {% if printer.toolhead.homed_axes|length < 3 %}
      HOME_XYZ
    {% endif %}
    _CLEAR_CLOG_RUN PASSES={n} HOT={params.HOT|default(250)|int} COLD={params.COLD|default(90)|int}
  {% endif %}

[gcode_macro _CLEAR_CLOG_RUN]
gcode:
  {% set n = params.PASSES|int %}
  {% set hot = params.HOT|int %}
  {% set pull = 30 %}
  {% set th = printer.toolhead %}
  {% set step = "SET_GCODE_VARIABLE MACRO=CLEAR_CLOG VARIABLE=step VALUE=" %}
  SAVE_GCODE_STATE NAME=clog
  G90
  G1 Z{[th.position.z, 60]|max} F600
  G1 X{th.axis_maximum.x / 2} Y10 F3000
  M83
  {% for p in range(n) %}
    SET_GCODE_VARIABLE MACRO=CLEAR_CLOG VARIABLE=pass VALUE={p + 1}
    {step}1
    M107
    M109 S{hot}
    G4 P30000
    {% if p %}
      G1 E{pull} F300
    {% endif %}
    {step}2
    {% for i in range(5) %}
      G1 E8 F60
      G1 E-8 F600
    {% endfor %}
    G1 E10 F60
    M400
    {step}3
    M104 S0
    M106 S255
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={params.COLD|int}
    M107
    {step}4
    FORCE_MOVE STEPPER=extruder DISTANCE=-{pull} VELOCITY=10 ACCEL=100
  {% endfor %}
  {step}5
  M109 S{hot}
  G1 E{pull} F300
  G1 E30 F90
  M400
  M104 S220
  RESTORE_GCODE_STATE NAME=clog
  {step}6

[gcode_macro CLEAR_CLOG_DONE]
description: Leave the panel's clog screen and turn the nozzle off
gcode:
  TURN_OFF_HEATERS
  SET_GCODE_VARIABLE MACRO=CLEAR_CLOG VARIABLE=step VALUE=0

# SET_KINEMATIC_POSITION / FORCE_MOVE before homing, and CLEAR_CLOG's cold pull.
[force_move]
enable_force_move: True

# The panel's HOME button sends HOME_XYZ, which is plain G28 (Z, then X, then
# Y). home_xyz.py (all three axes in one move; removed, in git history) is
# off for good: Klipper
# reads each endstop's trigger time only after the whole move, from a 32-bit
# MCU clock it can place only within 14.9 s (144 MHz). X and Y trigger long
# before Z, so their stops were misplaced by one clock wrap (149 mm at
# 5 mm/s) and the retract drove X and Y 149 mm into their ends (2026-11-05).
[gcode_macro HOME_XYZ]
gcode:
  G28

[homing_override]
axes: zxy
gcode:
 {% set all = not (params.X is defined or params.Y is defined or params.Z is defined) %}
 {% if all or params.Z is defined %}G28 Z{% endif %}
 {% if all or params.X is defined %}G28 X{% endif %}
 {% if all or params.Y is defined %}G28 Y{% endif %}

# Speed test (roadmap Q4): fast XY moves at SPEED (mm/s) and ACCEL, then
# re-home X and Y. GET_POSITION before and after; tools/ad4-speedtest.py
# compares the two step counts: a change of more than a step or so is a skip.
# Empty bed: the bed goes to at least Z 50 first.
[gcode_macro TEST_SPEED]
description: Fast XY moves, then re-home and report steps (skips)
gcode:
  {% set c = printer.configfile.settings.printer %}
  {% set th = printer.toolhead %}
  {% set speed = params.SPEED|default(60)|float %}
  {% set accel = params.ACCEL|default(c.max_accel)|float %}
  {% set iter = params.ITERATIONS|default(5)|int %}
  {% set b = params.BOUND|default(20)|float %}
  {% set s = params.SMALL|default(20)|float / 2 %}
  {% set x0 = th.axis_minimum.x + b %}{% set x1 = th.axis_maximum.x - b %}
  {% set y0 = th.axis_minimum.y + b %}{% set y1 = th.axis_maximum.y - b %}
  {% set xc = (x0 + x1) / 2 %}{% set yc = (y0 + y1) / 2 %}
  {% if speed > c.max_velocity or accel > 5000 %}
    RESPOND TYPE=error MSG="TEST_SPEED: SPEED over max_velocity ({c.max_velocity}) or ACCEL over 5000"
  {% else %}
    {% if th.homed_axes != "xyz" %}G28{% endif %}
    G90
    {% if th.position.z < 50 %}G1 Z50 F300{% endif %}
    G28 X Y
    M400
    GET_POSITION
    RESPOND MSG="TEST_SPEED {speed} mm/s, accel {accel}, {iter} rounds"
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}
    {% for i in range(iter) %}
      G1 X{x0} Y{y0} F{speed * 60}
      G1 X{x1} Y{y1}
      G1 X{x0} Y{y1}
      G1 X{x1} Y{y0}
      G1 X{x0} Y{y0}
      G1 X{x1} Y{y0}
      G1 X{x1} Y{y1}
      G1 X{x0} Y{y1}
      G1 X{x0} Y{y0}
      G1 X{xc - s} Y{yc - s}
      {% for j in range(4) %}
        G1 X{xc + s} Y{yc - s}
        G1 X{xc + s} Y{yc + s}
        G1 X{xc - s} Y{yc + s}
        G1 X{xc - s} Y{yc - s}
      {% endfor %}
    {% endfor %}
    SET_VELOCITY_LIMIT VELOCITY={c.max_velocity} ACCEL={c.max_accel}
    G1 X{x1} Y{y0} F3000
    M400
    G28 X Y
    M400
    GET_POSITION
  {% endif %}

# Speed modes (roadmap Q4), picked on the panel (TUNE > MODE) or with
# SPEED_MODE. Each caps the velocity, scales the slicer's speeds with M220 and
# raises flow and the nozzle temperature: past 60 mm/s the extruder
# under-delivers. The AD4 presets' 3 mm3/s limit holds lines at about 40 mm/s
# (variable_base), so S = 100 * cap / base and travel runs into the cap. The
# first layer stays at 50 mm/s at most until the slicer reports layer 2.
# Above CRUSH the mode's accel replaces the slicer's for every move, as tested.
# Values from 20 mm cubes in Rapid PLA+, 2026-11-05. CRUSH is the stock
# 60 mm/s at the slicer's temperature and flow.
# SPEED_MODE alone cycles CRUSH > WOODY > BUZZ > MCQUEEN; NAME= picks one. The
# choice is saved; PRINT_START applies it, a change mid-print applies at once,
# while paused on RESUME (which restores the speed and flow factors).
# BRACE ("Brace Yourself") is the machine's limit. It is locked: it needs
# CODE= the Konami code (UUDDLRLRBA, the panel's gamepad), is not in the
# cycle, and relocks to MCQUEEN when the job ends or is cancelled.
[save_variables]
filename: ~/printer_data/config/variables.cfg

[gcode_macro SPEED_MODE]
description: Speed mode: cycle, or NAME=CRUSH|WOODY|BUZZ|MCQUEEN
# name: [max mm/s, accel, nozzle C (0 = the slicer's), flow %]
variable_modes: {"CRUSH": [60, 2000, 0, 100], "WOODY": [100, 2000, 255, 125], "BUZZ": [120, 2000, 255, 130], "MCQUEEN": [150, 3000, 255, 135], "BRACE": [280, 5000, 260, 170]}
variable_order: ["CRUSH", "WOODY", "BUZZ", "MCQUEEN"]
variable_base: 40
variable_first: 50
variable_job_temp: 0
variable_pending: ""
gcode:
  {% set cur = printer.save_variables.variables.speed_mode|default("CRUSH") %}
  {% if params.NAME is defined %}
    {% set name = params.NAME|upper %}
  {% else %}
    {% set name = order[(order.index(cur) + 1) % order|length] if cur in order else "CRUSH" %}
  {% endif %}
  {% set st = printer.print_stats.state %}
  {% if name not in modes %}
    RESPOND TYPE=error MSG="SPEED_MODE: no mode {name}"
  {% elif name == "BRACE" and params.CODE|default("")|upper != "UUDDLRLRBA" %}
    RESPOND TYPE=error MSG="SPEED_MODE: BRACE is locked"
  {% else %}
    {% set m = modes[name] %}
    SAVE_VARIABLE VARIABLE=speed_mode VALUE='"{name}"'
    {% if st == "printing" %}
      _SPEED_MODE_APPLY NAME={name}
    {% elif st == "paused" %}
      SET_GCODE_VARIABLE MACRO=SPEED_MODE VARIABLE=pending VALUE='"{name}"'
    {% endif %}
    {% if name == "BRACE" %}
      RESPOND TYPE=error MSG="BRACE YOURSELF: {m[0]} mm/s, accel {m[1]}, {m[2]} C, flow {m[3]} %. This is the machine's limit. Proceed with extreme caution and stay at the printer."
    {% else %}
      RESPOND MSG="Speed mode {name}: {m[0]} mm/s, accel {m[1]}, flow {m[3]} %{(', ' ~ m[2] ~ ' C') if m[2] else ''}"
    {% endif %}
  {% endif %}

[gcode_macro _SPEED_MODE_APPLY]
gcode:
  {% set sm = printer["gcode_macro SPEED_MODE"] %}
  {% set m = sm.modes[params.NAME] %}
  {% set t = [m[2], sm.job_temp]|max %}
  {% set v = m[0] if (printer.print_stats.info.current_layer or 0) > 1 else [m[0], sm.first]|min %}
  _SET_VELOCITY_LIMIT_BASE VELOCITY={v} ACCEL={m[1]}
  M220 S{(m[0] * 100 / sm.base)|int}
  M221 S{m[3]}
  {% if t > 0 and printer.extruder.target > 0 %}M104 S{t}{% endif %}

# Orca sends SET_PRINT_STATS_INFO CURRENT_LAYER= at each layer change: lift
# the speed mode's first-layer limit at layer 2.
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: _SET_PRINT_STATS_INFO_BASE
gcode:
  _SET_PRINT_STATS_INFO_BASE {rawparams}
  {% if params.CURRENT_LAYER|default(0)|int == 2 %}
    {% set sm = printer["gcode_macro SPEED_MODE"] %}
    {% set mode = printer.save_variables.variables.speed_mode|default("CRUSH") %}
    _SET_VELOCITY_LIMIT_BASE VELOCITY={sm.modes[mode][0] if mode in sm.modes else 60}
  {% endif %}

# Orca sends SET_VELOCITY_LIMIT ACCEL= per feature (500 first layer, 1000
# print, 2000 travel). CRUSH keeps those; in faster modes, while printing,
# ACCEL is dropped so the mode's own accel holds. Macros that set an exact
# limit call _SET_VELOCITY_LIMIT_BASE.
[gcode_macro SET_VELOCITY_LIMIT]
rename_existing: _SET_VELOCITY_LIMIT_BASE
gcode:
  {% set sm = printer["gcode_macro SPEED_MODE"] %}
  {% set mode = printer.save_variables.variables.speed_mode|default("CRUSH") %}
  {% if params.ACCEL is defined and printer.print_stats.state == "printing" and mode in sm.modes and mode != "CRUSH" %}
    {% set rest = params|reject("equalto", "ACCEL")|list %}
    {% if rest %}_SET_VELOCITY_LIMIT_BASE {% for k in rest %}{k}={params[k]} {% endfor %}{% endif %}
  {% else %}
    _SET_VELOCITY_LIMIT_BASE {rawparams}
  {% endif %}

[gcode_macro _SPEED_MODE_RELOCK]
gcode:
  {% if printer.save_variables.variables.speed_mode|default("") == "BRACE" %}
    SAVE_VARIABLE VARIABLE=speed_mode VALUE='"MCQUEEN"'
  {% endif %}

[bed_mesh]
# No probe on this printer. The stock firmware's "nine point auto calibration"
# was a paper test at 9 points (roadmap Q5); BED_MESH_CALIBRATE METHOD=manual
# does the same, and Mainsail shows the TESTZ / ACCEPT dialog.
speed: 60
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 210, 190
probe_count: 3, 3
fade_start: 1
fade_end: 10
fade_target: 0

[firmware_retraction]
retract_length: 1.0
retract_speed: 25
unretract_extra_length: 0
unretract_speed: 25

# [input_shaper]: run SHAPER_CALIBRATE on this unit first (reference values
# were ADV3-derived, not measured).
