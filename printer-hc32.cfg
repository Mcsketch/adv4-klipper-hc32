# =============================================================
# Flashforge Adventurer 4 — HC32F460 (HD rev) Klipper config
# Draft generated 2026-09-27 from factory-firmware analysis +
# board-traced pins.
#
# CONFIDENT (keep as-is):  all board-traced pins, TMC2209-over-
#   UART mux layout, bed sensor PA0, heaters, fans, bed_mesh,
#   firmware_retraction, saved PID/position block at the bottom.
# MUST CHANGE (marked TODO-PROBE): hotend thermistor pin, LED
#   pin, thermistor curves, nozzle offset values.
# See adv4-exploration.md for the evidence.
# =============================================================

[include adv3-macros.cfg]
[include fluidd.cfg]
[include KAMP_Settings.cfg]
[exclude_object]

[mcu]
# RECOMMENDED (no soldering, no Klipper rebuild) — SoC bridge, see adv4-soc-hack.md:
#   serial: /dev/adv4_mcu        # socat PTY -> SoC bridge :5000 -> /dev/ttyS1 -> MCU
#   The MCU keeps its factory UART; no serial-pair Kconfig change, no wires.
#
# ALTERNATIVE (wired RPi->MCU, needs the serial rebuild below):
#   serial: /dev/serial0         # RPi hardware UART, RPi GPIO14/15 <-> MCU PA3/PA2
serial: /dev/adv4_mcu
baud: 250000
restart_method: command
# Note: the RECOMMENDED bridge path needs NO Klipper rebuild (MCU UART is unchanged).
# Only the wired alternative requires this rebuild:
# CONFIG_HC32F460_SERIAL_PA7_PA8 -> off, CONFIG_HC32F460_SERIAL_PA3_PA2 -> on
# (PA7/PA8 collide with X step PA8; every other Kconfig serial pair collides too).
# Set `baud:` to match the Klipper fw CONFIG_..._BAUDRATE (default 250000).

[printer]
kinematics: cartesian
# Starting values from the ADV3-derived stock config. Re-validate with
# ACCELERATION_TEST / SQUARE_CORNER_TEST before printing fast.
max_velocity: 800
square_corner_velocity: 6
max_accel: 6500
max_z_velocity: 30
max_z_accel: 400

[stepper_x]
step_pin: PA8
dir_pin: !PC9
enable_pin: !PA11
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC3
position_endstop: 220
position_max: 220
position_min: 0
homing_speed: 75

[stepper_y]
step_pin: PB14
dir_pin: !PB13
enable_pin: !PB15
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC1
position_endstop: 4
position_max: 200
position_min: 0
homing_speed: 75

[stepper_z]
step_pin: PA15
dir_pin: !PA12
enable_pin: !PC11
microsteps: 16
rotation_distance: 6.25
endstop_pin: !PB5
position_min: -2
position_max: 250
homing_speed: 25
second_homing_speed: 15

# ----------------------------------------------------------------
# Thermistors.
# PLACEHOLDER CURVES (ADV3 NTC) — the AD4 uses non-standard curves
# extracted from the factory MCU (see adv4-exploration.md §4.1):
#   hotend standard: 8.1C..215.2C ; high-temp nozzle: up to ~263C
#   bed: 10.2C (ADC 300) .. ~117C (ADC 170), firmware clamps ~110C
# After the probe pass, replace both with [thermistor] blocks built
# from the extracted (temp, ADC) pairs and live QUERY_ADC scaling.
# ----------------------------------------------------------------
[thermistor adv3_ntc]
temperature1: 19
resistance1:  123000
temperature2: 79
resistance2:  5820
temperature3: 230
resistance3:  255

[extruder]
step_pin: PC7
dir_pin: PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.3
filament_diameter: 1.750
heater_pin: PA1
sensor_type: adv3_ntc
# TODO-PROBE: stock template said PB7 — PB7 IS NOT AN ADC PIN on the
# HC32F460 (valid: PA0-PA7, PB0, PB1, PC0-PC5) and Klipper will
# refuse to load. Candidate pins NOT used by anything else:
#   PA4, PA6, PA7   (PB0/PB1 = TMC mux select; PC2/PC4/PC5 = fans/bed)
# Identify with probe.cfg: warm the nozzle, see which probe rises.
sensor_pin: PA4
min_temp: 0
# Nozzle rating, not the 215C table limit. 265 = factory UI ceiling
# for the high-temp nozzle. Add margin for sensor tolerance, never
# above what the fitted nozzle is rated for.
max_temp: 265
max_extrude_only_distance: 550
max_extrude_only_velocity: 2000
max_extrude_cross_section: 5
pressure_advance: 2.1
pressure_advance_smooth_time: 0.1

[heater_bed]
heater_pin: PC4
sensor_type: adv3_ntc
sensor_pin: PA0
min_temp: 0
# Factory firmware clamps the bed at ~110C. Keep it.
max_temp: 110

# REMOVED vs stock template: [temperature_sensor mcu_temp]
# (temperature_mcu is not implemented in the klipper-hc32 port;
# and on this board the hotend sensor on PB7 was the "cabin sensor"
# theory — no such sensor exists in the factory firmware.)

[heater_fan hotend_fan]
pin: PC2
heater: extruder
heater_temp: 50.0

[fan]
pin: PA5
cycle_time: 0.1

[controller_fan mainboard]
pin: PC5
heater: extruder, heater_bed

[fan_generic chamber_fan]
pin: PB9
cycle_time: 0.1

[output_pin led]
# TODO-PROBE: stock template had PB12 (unconfirmed). Find it with
# SET_PIN over candidates; then uncomment. Until then, delete this
# section so the config loads.
#pin: PB12
value: 1
pwm: true
cycle_time: 0.008333

# ----------------------------------------------------------------
# Nozzle temperature calibration (replaces the factory SoC behavior).
# The stock firmware stores a 2-digit per-nozzle target-temp offset
# on the SoC and shifts the setpoint before sending it to the MCU
# (Config::getExtruder*TempOffset / SerialObject::getAutoOffsetValue).
# Replicate that here as a macro. Values are YOUR measured ones:
#   nozzle A (e.g. 0.4mm, 235C): offset 12
#   nozzle B (e.g. 0.3mm, 265C): offset 14   <-- adjust to your real values
# Usage: M104 S210 then NOZZLE_OFFSET N=12, or fold into START.
# ----------------------------------------------------------------
[gcode_macro NOZZLE_OFFSET]
description: shift the current extruder target by the nozzle cal offset
gcode:
    {% set n = params.N|default(0)|int %}
    {% set cur = printer.extruder.target %}
    {% if cur > 0 %}
    M104 S{(cur + n)|int}
    {% endif %}

[homing_override]
axes: zxy
gcode:
 g28 z
 g28 x
 g28 y

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 200, 160
probe_count: 3, 3
fade_start: 1
fade_end: 10
fade_target: 0

[input_shaper]
# ADV3-derived starting values — re-run SHAPER_CALIBRATE per axis.
shaper_freq_x: 205
shaper_type: mzv
shaper_freq_y: 197.126
shaper_type: ei

[firmware_retraction]
retract_length: 3.8
retract_speed: 25
unretract_extra_length: 0
unretract_speed: 25

########################################
# tmc2209 configuration (board-traced — do not change pins)
# 4 TMC2209 share one UART (PC10) through an analog multiplexer.
# Mux COM = PC10, select A = PB10, select B = PB1, select C grounded.
# Channel map: 0=X  1=Extruder  2=Y  3=Z
########################################

[tmc2209 stepper_x]
uart_pin: PC10
select_pins: !PB10, !PB1
run_current: 0.600
sense_resistor: 0.220
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PC10
select_pins: PB0, !PB1
run_current: 0.600
sense_resistor: 0.220
# SpreadCycle on this axis: heavy bed + thick Y belts.

[tmc2209 stepper_z]
uart_pin: PC10
select_pins: !PB0, PB1
run_current: 0.600
sense_resistor: 0.220
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PC10
select_pins:  PB0,  PB1
run_current: 0.800
sense_resistor: 0.220

