# =============================================================
# Flashforge Adventurer 4 — HC32F460 (HD rev) Klipper config
# Draft generated 2026-09-27 from factory-firmware analysis +
# board-traced pins.
#
# CONFIDENT (keep as-is):  all board-traced pins, TMC2209-over-
#   UART mux layout, bed sensor PA0, heaters, fans, bed_mesh,
#   firmware_retraction, saved PID/position block at the bottom.
# MUST CHANGE (marked TODO-PROBE): hotend thermistor pin, LED
#   pin, thermistor curves, nozzle offset values.
# See adv4-exploration.md for the evidence.
# =============================================================

[include adv3-macros.cfg]
[include fluidd.cfg]
[include KAMP_Settings.cfg]
[exclude_object]

[mcu]
# RECOMMENDED (no soldering, no Klipper rebuild) — SoC bridge, see adv4-soc-hack.md:
#   serial: /dev/adv4_mcu        # socat PTY -> SoC bridge :5000 -> /dev/ttyS1 -> MCU
#   The MCU keeps its factory UART; no serial-pair Kconfig change, no wires.
#
# ALTERNATIVE (wired RPi->MCU, needs the serial rebuild below):
#   serial: /dev/serial0         # RPi hardware UART, RPi GPIO14/15 <-> MCU PA3/PA2
# serial: direct TCP to the SoC bridge (no socat PTY — it raced on reconnect)
serial: socket://192.168.10.10:5000
baud: 115200
restart_method: command
# Note: the RECOMMENDED bridge path needs NO Klipper rebuild (MCU UART is unchanged).
# Only the wired alternative requires this rebuild:
# CONFIG_HC32F460_SERIAL_PA7_PA8 -> off, CONFIG_HC32F460_SERIAL_PA3_PA2 -> on
# (PA7/PA8 collide with X step PA8; every other Kconfig serial pair collides too).
# Set `baud:` to match the Klipper fw CONFIG_..._BAUDRATE (default 250000).

[printer]
kinematics: cartesian
# Starting values from the ADV3-derived stock config. Re-validate with
# ACCELERATION_TEST / SQUARE_CORNER_TEST before printing fast.
max_velocity: 800
square_corner_velocity: 6
max_accel: 6500
max_z_velocity: 30
max_z_accel: 400

[stepper_x]
step_pin: PA8
dir_pin: !PC9
enable_pin: !PA11
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC3
position_endstop: 220
position_max: 220
position_min: 0
homing_speed: 75

[stepper_y]
step_pin: PB14
dir_pin: !PB13
enable_pin: !PB15
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC1
position_endstop: 4
position_max: 200
position_min: 0
homing_speed: 75

[stepper_z]
step_pin: PA15
dir_pin: !PA12
enable_pin: !PC11
microsteps: 16
rotation_distance: 6.25
endstop_pin: !PB5
position_min: -2
position_max: 250
homing_positive_dir: false   # Z homes down toward the bed (dual-Z bed)
homing_speed: 25
second_homing_speed: 15

