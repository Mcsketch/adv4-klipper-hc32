[extruder]
step_pin: PC7
dir_pin: PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.3
filament_diameter: 1.750
heater_pin: PC13  # PA1 parked here pending bed-heater test on PA1
# CONFIRMED 2026-10-21 by live probe: PC0 reads a stable ~250 ADC
# (28.5C on the factory curve) at room temp; PA2-PA7/PB0 float.
sensor_type: adv4_hotend
sensor_pin: PC0
adc_voltage: 1.0
min_temp: 0
# Nozzle rating, not the curve limit. 265 = factory UI ceiling
# for the high-temp nozzle; never exceed the fitted nozzle's rating.
max_temp: 265
max_extrude_only_distance: 550
max_extrude_only_velocity: 2000
max_extrude_cross_section: 5
pressure_advance: 2.1
pressure_advance_smooth_time: 0.1

[heater_bed]
heater_pin: PA1  # PC4 disproven (M140 no heat); testing PA1 (coupled into PA0)
sensor_type: adv4_bed
sensor_pin: PA0
adc_voltage: 1.0
min_temp: 0
# Bed rated 120-130C (user, 2026-10-22); factory LUT covers to 205C.
max_temp: 120

# Pin hunt RESOLVED 2026-10-21: hotend = PC0 (stable 28.5C room-temp
# reading on the factory curve), bed = PA0 (23.1C). PA2/PA3/PB0 read
# ADC ~0, PA4/PA6/PA7 read ADC ~4095 — all floating, no sensors.
#
# HEATER HUNT (2026-10-22): PA1 = BED heater CONFIRMED (M140: 23->67C
# in 40s; its PWM also couples noise into adjacent PA0 — that is what
# caused the old "ADC out of range" shutdowns). PC4 disproven (M140
# on PC4: no heat). Hotend heater: every unclaimed GPIO probed with
# SET_PIN 0.5 (PA2-PA7,PB0-PB4,PB6-PB8,PB11-PB12,PC12-PC13,PA13,PA14)
# — all inert. So the hotend heater sits on a pin this config
# currently assigns to steppers/fans/endstops (those are traced
# guesses). Firmware RE of control-2.3.0 heater code will settle it.

# NOTE: PA8/PC9/PA11=X, PB14/PB13/PB15=Y, PA15/PA12/PC11=Z,
# PC7/PC6/PC8=E, PC3/PC1/PB5=endstops — NOT free. Only PB11, PA13,
# PA14 remain (PC14/15 = OSC, left alone).

[output_pin p_PB11]
pin: PB11
[output_pin p_PA13]
pin: PA13
[output_pin p_PA14]
pin: PA14

[heater_fan hotend_fan]
pin: PC2
heater: extruder
heater_temp: 50.0

[fan]
pin: PA5
cycle_time: 0.1

[controller_fan mainboard]
pin: PC5
heater: extruder, heater_bed

[fan_generic chamber_fan]
pin: PB9
cycle_time: 0.1

# [output_pin led] — disabled until the LED pin is confirmed.
# Stock template used PB12 (unconfirmed). Find it with SET_PIN over
# candidates, then enable this whole block (and set pin: PBxx).
# (Commented so klippy loads; an output_pin section without 'pin:' errors.)
# [output_pin led]
# TODO-PROBE: stock template had PB12 (unconfirmed). Find it with
# SET_PIN over candidates; then uncomment. Until then, delete this
# section so the config loads.
#pin: PB12
#value: 1
#pwm: true
#cycle_time: 0.008333

# ----------------------------------------------------------------
# Nozzle temperature calibration (replaces the factory SoC behavior).
# The stock firmware stores a 2-digit per-nozzle target-temp offset
# on the SoC and shifts the setpoint before sending it to the MCU
# (Config::getExtruder*TempOffset / SerialObject::getAutoOffsetValue).
# Replicate that here as a macro. Values are YOUR measured ones:
#   nozzle A (e.g. 0.4mm, 235C): offset 12
#   nozzle B (e.g. 0.3mm, 265C): offset 14   <-- adjust to your real values
# Usage: M104 S210 then NOZZLE_OFFSET N=12, or fold into START.
# ----------------------------------------------------------------
[gcode_macro NOZZLE_OFFSET]
description: shift the current extruder target by the nozzle cal offset
gcode:
    {% set n = params.N|default(0)|int %}
    {% set cur = printer.extruder.target %}
    {% if cur > 0 %}
    M104 S{(cur + n)|int}
    {% endif %}

[homing_override]
axes: zxy
gcode:
 g28 z
 g28 x
 g28 y

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 200, 160
probe_count: 3, 3
fade_start: 1
fade_end: 10
fade_target: 0

[input_shaper]
# ADV3-derived starting values — re-run SHAPER_CALIBRATE per axis.
shaper_freq_x: 205
shaper_type: mzv
shaper_freq_y: 197.126
shaper_type: ei

[firmware_retraction]
retract_length: 3.8
retract_speed: 25
unretract_extra_length: 0
unretract_speed: 25

########################################
# tmc2209 configuration (board-traced — do not change pins)
# 4 TMC2209 share one UART (PC10) through an analog multiplexer.
# Mux COM = PC10, select A = PB10, select B = PB1, select C grounded.
# Channel map: 0=X  1=Extruder  2=Y  3=Z
########################################

[tmc2209 stepper_x]
uart_pin: PC10
select_pins: !PB10, !PB1
run_current: 0.600
sense_resistor: 0.220
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PC10
select_pins: !PB10, PB1
run_current: 0.600
sense_resistor: 0.220
# SpreadCycle on this axis: heavy bed + thick Y belts.

[tmc2209 stepper_z]
uart_pin: PC10
select_pins: PB10, PB1
run_current: 0.600
sense_resistor: 0.220
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PC10
select_pins:  PB10,  !PB1
run_current: 0.800
sense_resistor: 0.220

