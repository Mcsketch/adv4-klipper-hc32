# Thermistors.
# adv4_bed: EXACT curve extracted from the factory HD firmware
# (Adventurer4-HD-IAP-2.3.0-20230216.hex @0x1A6AC, 37 points, 10-205C).
# Live proof: PA0 ADC ~248 at 23C matches the table; bed heater on PA1
# CONFIRMED (23->67C in 40s). Bed is rated 120-130C (user).
# adv4_hotend: curve from the same firmware @0x1A4CC (table A,
# 21.5C steps, up to 387C). The AD4 takes TWO hotends: standard
# (240C) and high-temp (265C) — likely two tables in firmware; table
