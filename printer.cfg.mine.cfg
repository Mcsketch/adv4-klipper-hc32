# This file contains pin mappings for Adventurer 4 and MonoPrice Voxel PRO with FFP0187 mainboard
# There may be versions of these printers that require slight modifications to the config.
# To use this config, the firmware should be compiled for the STMicroelectronics STM32,
# Processor model STM32F103, Clock Reference 12 MHz crystal, Serial on USART1 PA10/PA9.
# To install Klipper, you must follow the steps as described here:
# https://github.com/synthread/Klippventurer

# See docs/Config_Reference.md for a description of parameters.

[include adv3-macros.cfg]
[include fluidd.cfg]
[include KAMP_Settings.cfg]
[exclude_object]

[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 800
square_corner_velocity: 6
max_accel: 6500
max_z_velocity: 30
max_z_accel: 400

[stepper_x]
step_pin: PA8
dir_pin: !PC9
enable_pin: !PA11
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC3
position_endstop: 220 # Set this to the distance between the endstop trigger point and touching the left side of the axis
position_max: 220 # Set this to the distance between the endstop and touching the right side of the axis, PLUS position_endstop
position_min: 0 # Leave this alone
homing_speed: 75

[stepper_y]
step_pin: PB14
dir_pin: !PB13
enable_pin: !PB15
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC1
position_endstop: 4 # Set this to the distance between the endstop trigger point and touching the back side of the axis
position_max: 200 # Set this to the distance between the endstop and touching the front side of the axis
homing_speed: 75

[stepper_z]
step_pin: PA15
dir_pin: !PA12
enable_pin: !PC11
microsteps: 16
rotation_distance: 6.25
endstop_pin: !PB5
position_min: -2 # This is slightly lower than the bed surface to allow for mesh leveling
#position_endstop: 148 # Leave this alone, use fluidd to calibrate your Z offset.
position_max: 250 # Set this to the distance between the endstop trigger point and touching the top of the axis. If you see the axis skew diagonally at this position, it's too high
homing_speed: 25
second_homing_speed: 15

[thermistor adv3_ntc]
temperature1: 19
resistance1:  123000
temperature2: 79
resistance2:  5820 
temperature3: 230
resistance3:  255 

[extruder]
step_pin: PC7
dir_pin: PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.3
filament_diameter: 1.750
heater_pin: PA1
sensor_type: adv3_ntc
sensor_pin: PB7
min_temp: -237.15
max_temp: 500
max_extrude_only_distance: 550
max_extrude_only_velocity: 2000
max_extrude_cross_section: 5
pressure_advance: 2.1
pressure_advance_smooth_time: 0.1

[heater_bed]
heater_pin: PC4
sensor_type: adv3_ntc
sensor_pin: PA0
min_temp: 0
max_temp: 110

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
#this is the operational temperature range of STM32f103
min_temp: -40
max_temp: 85


[heater_fan hotend_fan]
#Heatbreak Cooling Fan
pin: PC2
heater: extruder
heater_temp: 50.0

# Part cooling fan 
[fan]
pin: PA5
cycle_time: 0.1

# Mainboard cooling fan
[controller_fan mainboard]
pin: PC5
heater: extruder, heater_bed

# Chamber ventilation fan
[fan_generic chamber_fan]
pin: PB9
cycle_time: 0.1

[output_pin led]
#pin: PB12
value: 1
pwm: true
cycle_time: 0.008333 # This PWM frequency should stop the LED from flickering on video

[homing_override]
axes: zxy
gcode:
 g28 z
 g28 x
 g28 y

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 200, 160
probe_count: 3, 3
fade_start: 1
fade_end: 10
fade_target: 0

[input_shaper]
shaper_freq_x: 205
shaper_type: mzv
shaper_freq_y: 197.126
shaper_type: ei

[firmware_retraction]
retract_length: 3.8
retract_speed: 25
unretract_extra_length: 0
unretract_speed: 25

########################################
# tmc2209 configuration
########################################

# Com OUT/In of the multiplexer goes to PC10 as on adv3 
#logic pins A is PB10
#logic pins A is PB1
#logic pins C is connected to a grounded 10K resistor

# Pin 15 of the multiplexer (channel 2) goes to Y TMC UART_pin 
# Pin 14 of the multiplexer (channel 1) goes to Extruder TMC UART_pin 
# Pin 13 of the multiplexer (channel 0) goes to X TMC UART_pin 
# Pin 12 of the multiplexer (channel 3) goes to Z TMC UART_pin 

[tmc2209 stepper_x]
uart_pin: PC10
select_pins: !PB10, !PB1
# select_pins: !PB10, !PB1, !PD1


run_current: 0.600
sense_resistor: 0.220
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PC10
select_pins: PB0, !PB1
# select_pins: PB0, !PB1, !PD1
run_current: 0.600
sense_resistor: 0.220
#we use SpreadCycle on this axis due to the weight of the bed and print.

[tmc2209 stepper_z]
uart_pin: PC10
select_pins: !PB0, PB1
# select_pins: !PB0, PB1, !PD1
run_current: 0.600
sense_resistor: 0.220
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PC10
select_pins:  PB0,  PB1
# select_pins:  PB0,  PB1, !PD1
run_current: 0.800
sense_resistor: 0.220

