# ============================================================================
# probe.cfg — ZERO-RISK pin discovery for the Adventurer 4 (HC32F460)
# ----------------------------------------------------------------------------
# Purpose: identify the REAL AD4 GPIO pins (hotend/bed thermistor, endstops,
#          LED) WITHOUT firing any heater, moving any axis, or risking a brick.
#
# Safety model:
#   * NO [extruder], NO [heater_bed], NO [stepper_*]  => nothing can heat or move.
#   * Only read-only probes: QUERY_ADC / QUERY_ENDSTOP / QUERY_PIN.
#   * The only WRITE is one indicator LED candidate (mA level) via SET_PIN.
#   * MCU firmware is already pin-agnostic; this file just maps probes at runtime.
#
# Usage:
#   1) Back up the stock config, then:  cp probe.cfg ~/printer_data/config/printer.cfg
#      (or symlink). Keep the real config named elsewhere.
#   2) FIRMWARE: flash out/klipper.bin via the IAP procedure (see FLASH-IAP.md).
#   3) FIRMWARE_RESTART, then probe (commands below).
#
# ----------------------------------------------------------------------------
# HC32F460 Klipper HAL pin capability tables (src/hc32f460):
#   ADC (analog) ONLY: PA0-PA7, PB0-PB1, PC0-PC5   (16 channels, 12-bit)
#   Digital GPIO:      PA0-PA15, PB0-PB15, PC0-PC15, ... (all ports, 16 each)
#   => Any thermistor pin MUST be in the ADC list or Klipper shuts down with
#      "Not a valid ADC pin".  (This is why the ADV3 "PB7" hotend pin is wrong
#      on the AD4/HC32.)
# ============================================================================

[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

# ----------------------------------------------------------------------------
# THERMISTOR CANDIDATES (ADC-only pins). Each is a read-only probe.
# sensor_type temperature_ntc + the NTC curve gives real °C if the curve
# matches; even if it doesn't, the value still MOVES when you warm/short the
# thermistor, which is all you need to identify the pin.
# ----------------------------------------------------------------------------
[thermistor probe_ntc]
temperature1: 25
resistance1:  100000
temperature2: 100
resistance2:  1454
temperature3: 250
resistance3:  377

# All 16 ADC-capable pins on the HC32F460, each probed read-only.
[temperature_sensor probe_pa0]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PA0
[temperature_sensor probe_pa1]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PA1
[temperature_sensor probe_pa2]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PA2
[temperature_sensor probe_pa3]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PA3
[temperature_sensor probe_pa4]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PA4
[temperature_sensor probe_pa5]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PA5
[temperature_sensor probe_pa6]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PA6
[temperature_sensor probe_pa7]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PA7
[temperature_sensor probe_pb0]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PB0
[temperature_sensor probe_pb1]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PB1
[temperature_sensor probe_pc0]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PC0
[temperature_sensor probe_pc1]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PC1
[temperature_sensor probe_pc2]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PC2
[temperature_sensor probe_pc3]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PC3
[temperature_sensor probe_pc4]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PC4
[temperature_sensor probe_pc5]
sensor_type: temperature_ntc
sensor_mcal: probe_ntc
sensor_pin: PC5

# Internal die temp - always works, sanity check that MCU comms are alive.
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu

# ----------------------------------------------------------------------------
# ENDSTOP CANDIDATES. Read-only: no homing, no motion.
#   QUERY_ENDSTOP  -> prints "OPEN" or "TRIGGERED" for the named oid.
#   Physically press each switch and watch which one flips.
# Use [gcode_macro] or the host `QUERY_ENDSTOP` after you wire a probe oid.
# Simplest: comment in one at a time as a [gcode] endstop_pin and read it.
# ----------------------------------------------------------------------------
# [gcode_arbiter] ... (not needed). Instead, to probe an endstop pin without
# homing, use the low-level path via a minimal macro:
[gcode_macro PROBE_ENDSTOP]
rename_existing:
gcode:
  {action_respond_info("Use host gcode: QUERY_ENDSTOP oid=<n>")}

# ----------------------------------------------------------------------------
# LED CANDIDATE. Only WRITE in this file - an indicator LED (mA level, safe).
#   SET_PIN  pa1  value=1     -> LED on
#   SET_PIN  pa1  value=0     -> LED off
# Swap the pin for each candidate (PB12 from the ADV3 config is the starting
# guess). NEVER point SET_PIN at a heater/fan/stepper pin.
# ----------------------------------------------------------------------------

# ============================================================================
# PROBE SEQUENCE (run in order, Klippy connected)
# ============================================================================
# A. Thermistors (hotend + bed):
#    1) M105                       -> baseline: which probes read ~25-30C?
#    2) Warm the HOTEND thermistor tip with a finger / warm air.
#       Watch M105 repeatedly -> the probe whose value RISES = hotend pin.
#    3) Warm the BED thermistor (or short its 2 leads) -> the one that jumps = bed.
#    (Cross-check raw with: QUERY_ADC  -> "analog: <0..4095>" for the last oid.)
#
# B. Endstops (X, Y, Z):
#    1) For each candidate endstop pin, temporarily add:
#         [gcode_macro] ... or use host:  QUERY_ENDSTOP
#       Physically press the switch -> "OPEN"->"TRIGGERED" = that pin.
#
# C. LED:
#    SET_PIN  pb12  value=1   (swap pin) -> whichever makes the LED glow = LED pin.
#    SET_PIN  pb12  value=0
#
# D. When a pin is confirmed, record it in the real printer.cfg and remove
#    the matching probe section (a pin can't be both a probe and a stepper/etc).
# ============================================================================
