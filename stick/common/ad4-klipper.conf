# Adventurer 4 Klipper settings. Edit before you copy the stick; after the
# install the live copy is /opt/ad4-klipper/ad4-klipper.conf on the printer
# (edit over SSH, then reboot the printer).

# Wired Ethernet. Klipper's MCU link must run over a cable: over WiFi the clock
# sync drifts until Klipper stops with "Timer too close".
#   dhcp                   address from your router (shown on the panel)
#   192.168.100.20/24      static address, for a direct cable or a lab switch
#   off                    leave eth0 down
ETH_ADDR=dhcp
# Default gateway for a static ETH_ADDR (optional).
ETH_GW=

# Join the WiFi network saved in the stock firmware (on|off). WiFi is fine for
# SSH and for the panel's status polling, not for the MCU link.
WIFI=on

# Moonraker on the Klipper host, as HOST:PORT. The panel polls it for status
# and sends PREHEAT / COOLDOWN / PAUSE / RESUME / CANCEL. Leave empty and the
# panel only shows the printer's addresses. The printer's address must be in
# Moonraker's [authorization] trusted_clients.
MOONRAKER=

# TCP port of the serial bridge. Klipper: [mcu] serial: socket://PRINTER:5000
BRIDGE_PORT=5000

# TCP port of the camera server (MJPEG at /stream and /snapshot, also the stock
# /?action=stream URLs). Empty: no camera server.
CAM_PORT=8080

# Root password for SSH (user root, port 22).
#   empty   a random one is generated and written to ROOT_PASSWORD.txt
#           on the stick
#   keep    leave the current password alone
#   other   that password
ROOT_PASSWORD=
