# =============================================================
# Flashforge Adventurer 4 — Caleb's unit (NA rev, Nation N32G455 MCU)
# Klipper host: prodesk/veldin (192.168.1.10). Written 2026-10-27.
#
# Pin map = the repo's printer-hc32.cfg (Mcsketch/adv4-klipper-hc32): same
# FFP0187_Main_Board_V1.0.3 PCB, pins proven there by firmware RE + bench
# (steppers/endstops home, heaters/thermistors settled 2026-10-22). On this
# unit only the MCU link, thermistors, endstop readout (all open), a heater
# hold and the fans PC2 (heatsink) + PB9 (chamber) are verified (2026-10-28);
# NO motion has been run yet.
# Before the first print, with someone at the printer:
#   1. G28 X / G28 Y / G28 Z one at a time, hand on the power switch.
#   2. Z_ENDSTOP_CALIBRATE (position_endstop below is the REFERENCE unit's).
#   3. PID_CALIBRATE HEATER=extruder TARGET=210 / HEATER=heater_bed TARGET=60
#   4. Part-cooling fan pin: still unknown (see [fan_generic chamber_fan]).
# MCU link: MCU USART1 @115200 -> SoC /dev/ttyS1 -> ad4-bridge TCP :5000
# (started by /opt/ad4-klipper/klipper-boot.sh on the printer SoC at boot,
# eth0 192.168.100.20 on the lab switch).
# =============================================================

[include mainsail.cfg]

[mcu]
serial: socket://192.168.100.20:5000
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
# Conservative start values (the reference unit runs 800/6500). Raise after
# the first prints look right.
max_velocity: 150
max_accel: 2000
square_corner_velocity: 5
max_z_velocity: 15
max_z_accel: 100

[stepper_x]
step_pin: PA8
dir_pin: PC9
enable_pin: !PA11
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC3
position_endstop: 220
position_max: 220
position_min: 0
homing_speed: 50

[stepper_y]
step_pin: PB14
dir_pin: !PB13
enable_pin: !PB15
microsteps: 32
rotation_distance: 33.9
endstop_pin: ^PC1
position_endstop: 4
position_max: 200
position_min: 0
homing_speed: 50

[stepper_z]
step_pin: PA15
dir_pin: !PA12
enable_pin: !PC11
microsteps: 16
rotation_distance: 6.25
endstop_pin: ^PB5
# REFERENCE unit value — calibrate on this unit (Z_ENDSTOP_CALIBRATE) before printing.
position_endstop: 151.3
position_min: -2
position_max: 250
homing_positive_dir: false
homing_speed: 15
second_homing_speed: 5

# Thermistors: curves from the factory firmware LUTs (100k NTC, 4.7k pull-up).
[thermistor ad4_hotend]
temperature1: 55.0
resistance1: 29559.0
temperature2: 70.0
resistance2: 17285.0
temperature3: 260.0
resistance3: 189.0

[thermistor ad4_bed]
temperature1: 29.0
resistance1: 81221.9
temperature2: 110.0
resistance2: 5200.5
temperature3: 118.0
resistance3: 4214.5

[extruder]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: ad4_hotend
sensor_pin: PA0
pullup_resistor: 4700
min_temp: 0
max_temp: 265
min_extrude_temp: 170
max_extrude_only_distance: 550
max_extrude_cross_section: 5
# Uncalibrated starting point; tune with the Klipper PA tower.
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040
# PID from the reference unit (same heater/sensor); re-run PID_CALIBRATE here.
control: pid
pid_kp: 27.403
pid_ki: 9.615
pid_kd: 19.524

[heater_bed]
heater_pin: PA7
sensor_type: ad4_bed
sensor_pin: PA5
pullup_resistor: 4700
min_temp: 0
max_temp: 120
control: pid
pid_kp: 71.615
pid_ki: 3.913
pid_kd: 327.640

[heater_fan hotend_fan]
pin: PC2
heater: extruder
heater_temp: 50.0

[controller_fan mainboard]
pin: PC5
heater: extruder, heater_bed

# PB9 = chamber fan (M106 S255 spun the chamber fan on this unit, 2026-10-28).
# Drive with SET_FAN_SPEED FAN=chamber_fan SPEED=1. Part-cooling fan pin is
# still unknown; without [fan], slicer M106/M107 print "Unknown command" and
# are skipped (prints continue).
[fan_generic chamber_fan]
pin: PB9
cycle_time: 0.005

[gcode_macro NOZZLE_OFFSET]
description: shift the current extruder target by the nozzle cal offset (stock-firmware behaviour)
gcode:
    {% set n = params.N|default(0)|int %}
    {% set cur = printer.extruder.target %}
    {% if cur > 0 %}
    M104 S{(cur + n)|int}
    {% endif %}

# Bench aid: allows SET_KINEMATIC_POSITION / FORCE_MOVE before homing. Turn
# off once homing is proven on this unit.
[force_move]
enable_force_move: True

[homing_override]
axes: zxy
gcode:
 G28 Z
 G28 X
 G28 Y

[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 200, 160
probe_count: 3, 3
fade_start: 1
fade_end: 10
fade_target: 0

[firmware_retraction]
retract_length: 1.0
retract_speed: 25
unretract_extra_length: 0
unretract_speed: 25

# [input_shaper]: run SHAPER_CALIBRATE on this unit first (reference values
# were ADV3-derived, not measured).
