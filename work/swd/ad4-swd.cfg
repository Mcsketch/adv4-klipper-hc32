# Caleb's AD4 = NA board: Nation N32G455REL7 (Cortex-M4F, LQFP64) on FFP0187_Main_Board_V1.0.3.
# ST-Link V2 clone on header J16 (VCC SWCLK SWDIO GND; VCC is NOT connected), SWD, READ-ONLY use.
# No flash driver on purpose: we only ever read. Never flash/erase/touch option bytes here:
# clearing N32 read protection (RDP, option bytes @0x1FFFF800) = mass erase = vendor IAP bootloader gone.
source [find interface/stlink.cfg]
transport select hla_swd
adapter speed 480
set _CHIPNAME n32g455
source [find target/swj-dp.tcl]
# Cortex-M4 SW-DP IDCODE 0x2BA01477 (same DP as the HC32F460 assumed before 2026-10-27)
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap
$_CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0
# Default: no reset wire (J16 has no NRST). Connect-under-reset fallback = SoC gpio34 hold-low
# (see adv4-swd-dump.md "Reset control"). If an NRST pad is ever wired to the clone's RST, run with
#   -c "reset_config srst_only srst_nogate connect_assert_srst"
reset_config none
